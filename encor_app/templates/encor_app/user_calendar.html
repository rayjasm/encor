{% extends 'encor_app/layout.html' %}

{% block title %}{{ user.username }} さんのカレンダー{% endblock %}

{% load static %}

{% block content %}
    <div class="page-title">
        <h1>予約リクエストを送る</h1>
        <span class="page-title__sub"><b>{{ user.username }}</b> さんのカレンダー</span>
    </div>

    <p class="notice">
        <span class="material-icons" aria-hidden="true">touch_app</span>
        空いている日をクリックすると、希望日時と連絡先を入力して予約リクエストを送れます。予定をクリックすると詳細が見られます。
    </p>

    <div class="card calendar-card">
        <div id="calendar"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.js"></script>
    <script src="{% static 'encor_app/user_calendar.js' %}"></script>

    <!-- リクエスト送信モーダル -->
    <div class="cmodal" id="modal-template">
    <div class="modal__name">
    <label>予定の名前<input type="text" id="name" name="name" maxlength="10" placeholder="例: 野球、水族館"></label></div>

    <div class="modal__times">
    <label>開始時刻<input type="datetime-local" id="start" name="open_date"></label>
    <label>終了時刻<input type="datetime-local" id="end" name="close_date"></label></div>

    <div class="modal__color">
    <label>背景色<input type="color" id="color" value="#bae6fd"></label></div>

    <div class="modal__contact">
    <label>連絡先
    <span class="contact-kinds" aria-hidden="true">
        <span class="contact-kind"><span class="material-icons">call</span>電話</span>
        <span class="contact-kind"><span class="material-icons">mail</span>メール</span>
        <span class="contact-kind"><span class="material-icons">home</span>住所</span>
    </span>
    <input type="text" id="contact" name="contact" maxlength="100"
           placeholder="電話 / メール / 住所 のいずれか"
           aria-describedby="contact-hint">
    <span class="modal__hint" id="contact-hint">相手があなたに連絡するために使います</span>
    </label></div>

    <div class="modal__message">
    <label>コメント<input type="text" id="message" name="message"></label></div>

    <div class="modal-action-buttons">
    <button class="modal-action-buttons__button save" id="save">送信</button>
    <button class="modal-action-buttons__button delete" id="delete">削除</button>
    <button class="modal-action-buttons close material-icons" id="cancel" title="閉じる">close</button>
    </div>
    </div>

    <!-- 予定の詳細モーダル -->
    <div class="smodal" id="show-modal" style="display: none;">
        <div class="modal-content">
            <span class="close-button" id="cancel" title="閉じる">&times;</span>

            <h2>予定の詳細</h2>

            <div class="modal__field">
                <label>タイトル</label>
                <span id="modal-title"></span>
            </div>

            <div class="modal__field">
                <label>開始</label>
                <span id="modal-start"></span>
            </div>

            <div class="modal__field">
                <label>終了</label>
                <span id="modal-end"></span>
            </div>

            <div class="modal__field">
                <label>場所</label>
                <span id="modal-location"></span>
            </div>

            <div class="modal__field">
                <label>コメント</label>
                <span id="modal-message"></span>
            </div>
        </div>
    </div>
{% endblock%}
