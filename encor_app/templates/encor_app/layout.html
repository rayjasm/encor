{% load static %}
<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Encor{% endblock %} | Encor</title>
    <!-- CSS -->
    <link rel="stylesheet" type="text/css" href="{% static 'encor_app/css/style.css' %}" />
    <!-- fullcalendar -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.css">
    <script src="https://unpkg.com/@fullcalendar/core/main.js"></script>
    <script src="https://unpkg.com/@fullcalendar/daygrid/main.js"></script>
    <script src="https://unpkg.com/@fullcalendar/locales@latest/locales-all.js"></script>
    <!-- material-icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/material-icons@1.13.12/iconfont/material-icons.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-logo" href="{% url 'index' %}">Encor</a>
            <nav class="site-nav">
                {% if user.is_authenticated %}
                    <a class="site-nav__link" href="{% url 'mypage' %}">
                        <span class="material-icons" aria-hidden="true">calendar_month</span>マイページ
                    </a>
                    <span class="site-nav__user">{{ user.username }}</span>
                    <form method="post" action="{% url 'signout' %}" class="site-nav__form">
                        {% csrf_token %}
                        <button type="submit" class="btn btn--ghost btn--small">サインアウト</button>
                    </form>
                {% else %}
                    <a class="btn btn--ghost btn--small" href="{% url 'signin' %}">サインイン</a>
                    <a class="btn btn--primary btn--small" href="{% url 'signup' %}">新規登録</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page">
    {% block content %}
    {% endblock %}
    </main>

    <footer class="site-footer">
        <small>&copy; Encor</small>
    </footer>
</body>
</html>
