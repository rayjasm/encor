{% extends 'encor_app/layout.html' %}

{% block title %}mypage{% endblock %}

{% load static %}

{% block content %}
    <h1>my page</h1>
    Hi <b>{{ user.username }}</b>

    <!-- 新着リクエスト一覧 -->
    <section class="requests-panel" id="requests-panel">
        <h2 class="requests-panel__heading">
            新着リクエスト<span class="requests-panel__count" id="requests-count"></span>
        </h2>
        <p class="requests-panel__empty" id="requests-empty">新着リクエストはありません</p>
        <ul class="requests-list" id="requests-list"></ul>
    </section>

    <!-- 新着リクエスト1件分の行テンプレート -->
    <template id="request-row-template">
        <li class="request-row">
            <div class="request-row__body">
                <div class="request-row__main">
                    <span class="request-row__name"></span>
                    <span class="request-row__time"></span>
                </div>
                <div class="request-row__sub">
                    <span class="request-row__contact"></span>
                    <span class="request-row__message"></span>
                </div>
                <div class="request-row__received"></div>
            </div>
            <div class="request-row__actions">
                <select class="request-row__visibility" title="承諾後の公開設定">
                    <option value="public">公開</option>
                    <option value="private">非公開</option>
                </select>
                <button type="button" class="modal-action-buttons__button save request-row__accept">承諾</button>
                <button type="button" class="modal-action-buttons__button delete request-row__decline">辞退</button>
            </div>
        </li>
    </template>

    <div id="calendar"></div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/fullcalendar@5.10.2/main.js"></script>
    <script src="{% static 'encor_app/calendar.js' %}"></script>

    <div class="cmodal" id="modal-template">
    <div class="modal__title">
    <label>タイトル : <input type="text" id="title" name="title"></label></div>

    <div class="modal__times">
    <label>開始時刻 : <input type="datetime-local" id="start" name="open_date"></label>
    <label>終了時刻 : <input type="datetime-local" id="end" name="close_date"></label></div>

    <div class="modal__color">
    <label>背景色 : <input type="color" id="color"></label></div>

    <div class="modal__location">
    <label>場所 : <input type="text" id="location" name="location"></label></div>

    <div class="modal__message">
    <label>コメント : <input type="text" id="message" name="message"></label></div>

    <div class="modal__visibility">
    <label>公開設定 :
    <select id="visibility" name="visibility">
        <option value="public">公開</option>
        <option value="private">非公開</option>
    </select></label></div>

    <div class="modal-action-buttons">
    <button class="modal-action-buttons__button save" id="save">保存</button>
    <button class="modal-action-buttons__button delete" id="delete">削除</button>
    <button class="modal-action-buttons close material-icons" id="cancel">cancel</button>
    </div>
    </div>

    <!-- リクエスト(オファー)確認モーダル -->
    <div class="cmodal omodal" id="offer-modal-template">
    <h3 class="omodal__heading">予約リクエストが届いています</h3>

    <div class="modal__field"><label>名前 : </label><span id="offer-name"></span></div>
    <div class="modal__field"><label>開始 : </label><span id="offer-start"></span></div>
    <div class="modal__field"><label>終了 : </label><span id="offer-end"></span></div>
    <div class="modal__field"><label>連絡先 : </label><span id="offer-contact"></span></div>
    <div class="modal__field"><label>コメント : </label><span id="offer-message"></span></div>

    <div class="modal__visibility">
    <label>承諾後の公開設定 :
    <select id="offer-visibility" name="visibility">
        <option value="public">公開</option>
        <option value="private">非公開</option>
    </select></label></div>

    <div class="modal-action-buttons">
    <button class="modal-action-buttons__button save" id="offer-accept">承諾</button>
    <button class="modal-action-buttons__button delete" id="offer-decline">辞退</button>
    <button class="modal-action-buttons close material-icons" id="offer-cancel">cancel</button>
    </div>
    </div>
    <br>
    <p>
    <button id="copy-calendar-url" data-url="{% url 'user_calendar' user_id=request.user.id %}">カレンダーを共有</button>
    </p>
    <script>
        document.getElementById('copy-calendar-url').addEventListener('click', function() {
            var url = this.getAttribute('data-url');
            navigator.clipboard.writeText(url).then(function() {
                alert('URLがクリップボードにコピーされました: ' + url);
            }).catch(function(err) {
                alert('コピーに失敗しました: ' + err);
            });
        });
    </script>

    <!-- サインアウト -->
{% endblock%}
